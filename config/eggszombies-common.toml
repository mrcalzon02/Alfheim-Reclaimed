
[global_settings]
	#Allow zombies to spawn during daytime
	allow_daylight_spawn = false
	#Allow common zombies to spawn underground
	common_underground_spawn = true
	#Allow special zombies to spawn underground
	special_underground_spawn = true

[zombie_abilities]

	[zombie_abilities.Chances]
		#Adjust the probability of specific zombie behaviors
		#Range: 0.0 ~ 1.0
		firefighter_axe_spawn_chance = 0.8
		#Range: 0.0 ~ 1.0
		hazmat_poison_attack_chance = 0.25
		#Range: 0.0 ~ 1.0
		military_pierce_attack_chance = 0.25
		#Range: 0.0 ~ 1.0
		military_armor_reduction_chance = 0.5
		#Range: 0.0 ~ 1.0
		riot_shield_knock-up_chance = 0.5
		#Range: 0.0 ~ 1.0
		riot_armor_reduction_chance = 0.25
		#Range: 0.0 ~ 1.0
		crawler_bone_attack_chance = 0.25

	[zombie_abilities.Cooldowns]
		#Control the frequency of special attacks. Note: 20 ticks = 1 second
		#Cooldown between Bulldog leap attacks
		#Range: 20 ~ 1200
		bulldog_leap_cooldown = 80
		#Cooldown between Puker vomit projectiles
		#Range: 20 ~ 1200
		puker_puke_cooldown = 200
		#Cooldown between Rusher charge attacks
		#Range: 40 ~ 1200
		rusher_rush_cooldown = 280

