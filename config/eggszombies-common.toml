	#Individual base statistics for every zombie variant
	[Zombies_Attributes.firefighter]
		#Maximum Health
		#Range: 1.0 ~ 1000.0
		max_health = 25.0
		#Movement Speed
		#Range: 0.0 ~ 1.0
		movement_speed = 0.23
		#Base Attack Damage
		#Range: 0.0 ~ 100.0
		attack_damage = 3.0
		#Base Armor Points
		#Range: 0.0 ~ 30.0
		armor = 5.0
		#Resistance to knockback
		#Range: 0.0 ~ 1.0
