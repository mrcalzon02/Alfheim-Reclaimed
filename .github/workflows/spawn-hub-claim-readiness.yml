name: Alfheim player safety and companion wheel source controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spawn-hub-claim-readiness.yml'
      - 'tools/test_spawn_hub_claim_readiness.cjs'
      - 'tools/test_starting_kit_recovery.cjs'
      - 'tools/test_spawn_dimension_recovery.cjs'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionChunkTickets.java'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/ChunkTicketDelta.java'
      - 'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/ChunkTicketDeltaSelfTest.java'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionSummonService.java'
      - 'tools/test_companion_lifecycle_guards.cjs'
      - 'tools/test_companion_dismiss_inventory.py'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionHandoffRules.java'
      - 'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/CompanionHandoffRulesSelfTest.java'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionLandingPlan.java'
      - 'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/CompanionLandingPlanSelfTest.java'
      - 'tools/test_companion_landing_safety.cjs'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/memory/CompanionAdmissionGate.java'
      - 'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/memory/CompanionAdmissionGateSelfTest.java'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/CompanionEvents.java'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/memory/CompanionSavedData.java'
      - 'tools/test_companion_admission_guards.cjs'
      - 'tools/smoke_companion_server.py'
      - 'tools/gen_world_hub.py'
      - 'tools/test_world_hub_height_contract.py'
      - 'tools/test_world_hub_restart_forceload.py'
      - 'kubejs/data/alfheim/functions/hub/autoload.mcfunction'
      - 'kubejs/data/alfheim/predicates/hub/ground_height.json'
      - 'kubejs/data/alfheim/functions/hub/place.mcfunction'
      - 'kubejs/data/alfheim/functions/hub/anchor.mcfunction'
      - 'kubejs/data/alfheim/functions/hub/fallback.mcfunction'
      - 'kubejs/data/alfheim/functions/hub/status.mcfunction'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionDeathInventoryService.java'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/CompanionCommandWheelScreen.java'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/WheelSelection.java'
      - 'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/client/WheelSelectionSelfTest.java'
      - 'kubejs/server_scripts/01_starting_kit.js'
      - 'kubejs/server_scripts/02_spawn_dimension.js'
      - 'tools/templates/spawn_hub_protection.js'
      - 'kubejs/server_scripts/04_spawn_hub.js'
      - 'tools/check_spawn_hub_claim.py'
      - 'tools/run_server.py'
      - 'tools/test_run_server_mirror_safety.py'
  workflow_dispatch:
    inputs:
      build_companion:
        description: 'Also run full Java 17 ForgeGradle test/build (manual opt-in)'
        required: false
        type: boolean
        default: false
      smoke_companion:
        description: 'Run the verified 2026-11-19 candidate on a loopback-only minimal Forge server'
        required: false
        type: boolean
        default: false
      full_pack_companion:
        description: 'Run the full tracked server pack with the SHA-pinned candidate in temporary staging'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  source-and-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout first-party Greatbole claim sources only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/test_spawn_hub_claim_readiness.cjs
            tools/test_starting_kit_recovery.cjs
            tools/test_spawn_dimension_recovery.cjs
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionChunkTickets.java
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/ChunkTicketDelta.java
            first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/ChunkTicketDeltaSelfTest.java
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionSummonService.java
            tools/test_companion_lifecycle_guards.cjs
            tools/test_companion_dismiss_inventory.py
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionHandoffRules.java
            first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/CompanionHandoffRulesSelfTest.java
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionLandingPlan.java
            first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/CompanionLandingPlanSelfTest.java
            tools/test_companion_landing_safety.cjs
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/memory/CompanionAdmissionGate.java
            first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/memory/CompanionAdmissionGateSelfTest.java
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/CompanionEvents.java
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/memory/CompanionSavedData.java
            tools/test_companion_admission_guards.cjs
            tools/smoke_companion_server.py
            tools/gen_world_hub.py
            tools/test_world_hub_height_contract.py
            tools/test_world_hub_restart_forceload.py
            kubejs/data/alfheim/functions/hub/autoload.mcfunction
            kubejs/data/alfheim/predicates/hub/ground_height.json
            kubejs/data/alfheim/functions/hub/place.mcfunction
            kubejs/data/alfheim/functions/hub/anchor.mcfunction
            kubejs/data/alfheim/functions/hub/fallback.mcfunction
            kubejs/data/alfheim/functions/hub/status.mcfunction
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionDeathInventoryService.java
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/CompanionCommandWheelScreen.java
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/WheelSelection.java
            first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/client/WheelSelectionSelfTest.java
            kubejs/server_scripts/01_starting_kit.js
            kubejs/server_scripts/02_spawn_dimension.js
            tools/templates/spawn_hub_protection.js
            kubejs/server_scripts/04_spawn_hub.js
            tools/check_spawn_hub_claim.py
            tools/run_server.py
            tools/test_run_server_mirror_safety.py
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax and real generated-script negative controls
        run: |
          node --check kubejs/server_scripts/04_spawn_hub.js
          node --check kubejs/server_scripts/01_starting_kit.js
          node --check kubejs/server_scripts/02_spawn_dimension.js
          node --check tools/test_spawn_hub_claim_readiness.cjs
          node --check tools/test_starting_kit_recovery.cjs
          node --check tools/test_spawn_dimension_recovery.cjs
          node tools/test_spawn_hub_claim_readiness.cjs
          node tools/test_starting_kit_recovery.cjs
          node tools/test_spawn_dimension_recovery.cjs
          node --check tools/test_companion_lifecycle_guards.cjs
          node tools/test_companion_lifecycle_guards.cjs
          node --check tools/test_companion_landing_safety.cjs
          node tools/test_companion_landing_safety.cjs
          node --check tools/test_companion_admission_guards.cjs
          node tools/test_companion_admission_guards.cjs
      - name: Python full-envelope command and read-back negative controls
        run: |
          python3 tools/check_spawn_hub_claim.py --self-test
          python3 tools/smoke_companion_server.py --self-test
          python3 tools/test_world_hub_height_contract.py
          python3 tools/test_world_hub_restart_forceload.py
          python3 tools/test_run_server_mirror_safety.py
      - name: Java 17 for dependency-free wheel selection tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify dependency-free Java 17 geometry and tickets
        run: |
          mkdir -p "$RUNNER_TEMP/alfheim-source-tests"
          javac --release 17 -d "$RUNNER_TEMP/alfheim-source-tests" \
            'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/WheelSelection.java' \
            'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/client/WheelSelectionSelfTest.java' \
            'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/ChunkTicketDelta.java' \
            'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/ChunkTicketDeltaSelfTest.java' \
            'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionHandoffRules.java' \
            'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/CompanionHandoffRulesSelfTest.java' \
            'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/service/CompanionLandingPlan.java' \
            'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/service/CompanionLandingPlanSelfTest.java' \
            'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/memory/CompanionAdmissionGate.java' \
            'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/memory/CompanionAdmissionGateSelfTest.java'
          java -cp "$RUNNER_TEMP/alfheim-source-tests" \
            com.continuityworks.alfheimcompanion.client.WheelSelectionSelfTest
          java -cp "$RUNNER_TEMP/alfheim-source-tests" \
            com.continuityworks.alfheimcompanion.service.ChunkTicketDeltaSelfTest
          java -cp "$RUNNER_TEMP/alfheim-source-tests" \
            com.continuityworks.alfheimcompanion.service.CompanionHandoffRulesSelfTest
          java -cp "$RUNNER_TEMP/alfheim-source-tests" \
            com.continuityworks.alfheimcompanion.service.CompanionLandingPlanSelfTest
          java -cp "$RUNNER_TEMP/alfheim-source-tests" \
            com.continuityworks.alfheimcompanion.memory.CompanionAdmissionGateSelfTest
      - name: Compile actual inventory-retention service against Java 17 test doubles
        run: python3 tools/test_companion_dismiss_inventory.py
      - name: Checkout companion Gradle sources and compile-only integrations (manual opt-in)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[forge-build]')) }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          path: forge-candidate
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            first_party_mods/alfheim_companion/
            server/mods/ftb-chunks-forge-2001.3.8.jar
            server/mods/ftb-quests-forge-2001.4.22.jar
            server/mods/ftb-library-forge-2001.2.13.jar
            server/mods/ftb-teams-forge-2001.3.2.jar
            server/mods/architectury-9.2.14-forge.jar
            server/mods/Mine_and_Slash-1.20.1-6.4.7.jar
            server/mods/Library_of_Exile-1.20.1-2.1.11.jar
      - name: Build and test first-party companion with ForgeGradle (manual opt-in)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[forge-build]')) }}
        working-directory: forge-candidate/first_party_mods/alfheim_companion
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean test build -Pinstance_mods_dir=../../server/mods
          sha256sum build/libs/alfheim_companion-*.jar
      - name: Retain only first-party candidate JAR (manual opt-in)
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.build_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[forge-build]'))) && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: alfheim-companion-candidate-${{ github.sha }}
          path: forge-candidate/first_party_mods/alfheim_companion/build/libs/alfheim_companion-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Checkout isolated Forge server runtime for candidate smoke
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.smoke_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[forge-smoke]'))) || ((github.event_name == 'workflow_dispatch' && inputs.full_pack_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pack-smoke]'))) }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          path: smoke-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            server/libraries/
            server/eula.txt
      - name: Download previously verified first-party JAR (never third-party artifacts)
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.smoke_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[forge-smoke]'))) || ((github.event_name == 'workflow_dispatch' && inputs.full_pack_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pack-smoke]'))) }}
        uses: actions/download-artifact@v4
        with:
          name: alfheim-companion-candidate-f1a43100c45ba1efb52db673f624362774fa6f4f
          run-id: 44626195977
          github-token: ${{ github.token }}
          path: smoke-candidate
      - name: Verify and boot minimal loopback-only Forge server with candidate
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.smoke_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[forge-smoke]')) }}
        timeout-minutes: 12
        run: |
          python3 tools/smoke_companion_server.py \
            --server-root smoke-source/server \
            --candidate smoke-candidate/alfheim_companion-0.2.0.jar \
            --expected-sha256 f88b8bbd746631cdbf9fb23575d335cfbe97259dde913d5840d55656cf7eb246 \
            --output-dir smoke-evidence \
            --heap-gib 4 --timeout 480
      - name: Retain smoke log and result only (never mod binaries or worlds)
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.smoke_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[forge-smoke]'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: alfheim-companion-smoke-evidence-${{ github.sha }}
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Checkout complete tracked modpack into isolated staging
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_pack_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pack-smoke]')) }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          path: fullpack-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            server/mods/
            config/
            defaultconfigs/
            kubejs/
      - name: Verify full-modpack Forge boot and Greatbole persistence after restart
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_pack_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pack-smoke]')) }}
        timeout-minutes: 35
        run: |
          python3 tools/smoke_companion_server.py \
            --profile full --pack-root fullpack-source --seed alfheim --hub-observe-seconds 120 --verify-restart \
            --server-root smoke-source/server \
            --candidate smoke-candidate/alfheim_companion-0.2.0.jar \
            --expected-sha256 f88b8bbd746631cdbf9fb23575d335cfbe97259dde913d5840d55656cf7eb246 \
            --output-dir fullpack-evidence \
            --heap-gib 6 --timeout 840
      - name: Retain full-modpack startup evidence even on failure (logs and JSON only)
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.full_pack_companion) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-pack-smoke]'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: alfheim-fullpack-smoke-evidence-${{ github.sha }}
          path: fullpack-evidence/
          if-no-files-found: warn
          retention-days: 7
