name: Alfheim player safety and companion wheel source controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spawn-hub-claim-readiness.yml'
      - 'tools/test_spawn_hub_claim_readiness.cjs'
      - 'tools/test_starting_kit_recovery.cjs'
      - 'tools/test_spawn_dimension_recovery.cjs'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/CompanionCommandWheelScreen.java'
      - 'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/WheelSelection.java'
      - 'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/client/WheelSelectionSelfTest.java'
      - 'kubejs/server_scripts/01_starting_kit.js'
      - 'kubejs/server_scripts/02_spawn_dimension.js'
      - 'tools/templates/spawn_hub_protection.js'
      - 'kubejs/server_scripts/04_spawn_hub.js'
      - 'tools/check_spawn_hub_claim.py'
      - 'tools/run_server.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout first-party Greatbole claim sources only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/test_spawn_hub_claim_readiness.cjs
            tools/test_starting_kit_recovery.cjs
            tools/test_spawn_dimension_recovery.cjs
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/CompanionCommandWheelScreen.java
            first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/WheelSelection.java
            first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/client/WheelSelectionSelfTest.java
            kubejs/server_scripts/01_starting_kit.js
            kubejs/server_scripts/02_spawn_dimension.js
            tools/templates/spawn_hub_protection.js
            kubejs/server_scripts/04_spawn_hub.js
            tools/check_spawn_hub_claim.py
            tools/run_server.py
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax and real generated-script negative controls
        run: |
          node --check kubejs/server_scripts/04_spawn_hub.js
          node --check kubejs/server_scripts/01_starting_kit.js
          node --check kubejs/server_scripts/02_spawn_dimension.js
          node --check tools/test_spawn_hub_claim_readiness.cjs
          node --check tools/test_starting_kit_recovery.cjs
          node --check tools/test_spawn_dimension_recovery.cjs
          node tools/test_spawn_hub_claim_readiness.cjs
          node tools/test_starting_kit_recovery.cjs
          node tools/test_spawn_dimension_recovery.cjs
      - name: Python full-envelope command and read-back negative controls
        run: python3 tools/check_spawn_hub_claim.py --self-test
      - name: Java 17 for dependency-free wheel selection tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify wheel geometry (not the Forge mod)
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-selection"
          javac --release 17 -d "$RUNNER_TEMP/wheel-selection" \
            'first_party_mods/alfheim_companion/src/main/java/com/continuityworks/alfheimcompanion/client/WheelSelection.java' \
            'first_party_mods/alfheim_companion/src/test/java/com/continuityworks/alfheimcompanion/client/WheelSelectionSelfTest.java'
          java -cp "$RUNNER_TEMP/wheel-selection" \
            com.continuityworks.alfheimcompanion.client.WheelSelectionSelfTest
