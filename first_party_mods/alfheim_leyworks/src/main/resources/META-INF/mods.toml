# Alfheim Leyworks.
#
# Hard dependencies are Forge and Minecraft, and that is the whole list. The node reads a
# pyramid, projects along six axes and applies an aura; none of that needs another mod at load
# time. Two soft relationships are declared below because they are real even though they are not
# load-order constraints, and writing them down is cheaper than rediscovering them.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# KubeJS owns two things this mod names but does not require: `alfheim:leyline_presence`, the
# aura effect, and `alfheim:elementium_core`, the activation ingredient. Both are looked up
# rather than linked -- a missing effect makes the node project without buffing, and a missing
# item drops one recipe -- so this stays optional. AFTER only so the pack reads in a sane order.
[[dependencies.${mod_id}]]
    modId="kubejs"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
