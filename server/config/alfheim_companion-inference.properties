# The worker is local-only and is started when the companion is summoned.
enabled=true
endpoint=http://127.0.0.1:18081/v1/chat/completions
model=tjake/Qwen2.5-0.5B-Instruct-JQ4
timeout_seconds=30
max_output_tokens=64

# Prefer the deterministic conversation catalog. Set this to true only for deliberate testing of
# one-pass, evidence-grounded free-form answers.
allow_freeform=false

manage_worker=true
java_path=alfheim_companion/inference/runtime/bin/java.exe
worker_directory=alfheim_companion/inference/worker
model_directory=alfheim_companion/inference/models/tjake_Qwen2.5-0.5B-Instruct-JQ4
idle_seconds=300
